  <meta name="description" content="Gastos da casa, cartões e sobras do mês.">
  <meta name="theme-color" content="#0e3b31">
  <meta name="color-scheme" content="light dark">
  <script>
    // Tema dia/noite antes de desenhar a tela (evita piscar branco à noite).
    // tema: "dia", "noite" ou nada (= automático, segue o iPhone).
    (function () {
      var mq = matchMedia("(prefers-color-scheme: dark)");
      var key = /[?&]demo(=|&|$)/.test(location.search) ? "casa-demo.tema" : "casa.tema"; // o teste guarda separado
      function pref() { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
      function apply() {
        var p = pref(), t = p === "dia" ? "light" : p === "noite" ? "dark" : (mq.matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#0a231d" : "#0e3b31"); // igual ao topo do app
      }
      apply();
      if (mq.addEventListener) mq.addEventListener("change", apply); else mq.addListener(apply);
      window.casaTema = apply;
    })();
  </script>
